services:
  web:
    build: .
    environment:
      TCG_SMTP_HOST: "${TCG_SMTP_HOST:-}"
      TCG_SMTP_PORT: "${TCG_SMTP_PORT:-}"
      TCG_SMTP_USERNAME: "${TCG_SMTP_USERNAME:-}"
      TCG_SMTP_PASSWORD: "${TCG_SMTP_PASSWORD:-}"
      TCG_SMTP_FROM: "${TCG_SMTP_FROM:-}"
      TCG_SMTP_TLS: "${TCG_SMTP_TLS:-starttls}"
      TCG_EMAIL_CODE_SECRET: "${TCG_EMAIL_CODE_SECRET:-}"
      TCG_ALLOW_PROXY_SWITCH: "${TCG_ALLOW_PROXY_SWITCH:-true}"
      RAPIDAPI_KEY: "${RAPIDAPI_KEY:-}"
      TCG_SEARCH_PROXY_URL: "${TCG_SEARCH_PROXY_URL-http://62.234.212.90:8080/proxy}"
      TCG_CURRENCY_CACHE: /app/data/currency.sqlite3
      TCG_USER_DB: /app/data/users.sqlite3
      TCG_TRUSTED_ORIGINS: "${TCG_TRUSTED_ORIGINS:-}"
      FORWARDED_ALLOW_IPS: "${TCG_PROXY_IPS:-127.0.0.1}"
    volumes:
      - currency-data:/app/data
    ports:
      - "127.0.0.1:${TCG_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  currency-data:

networks:
  default:
    ipam:
      config:
        - subnet: "${TCG_SUBNET:-10.203.0.0/24}"
