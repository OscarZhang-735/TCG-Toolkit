[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcg-toolkit"
version = "0.1.0"
description = "Normalized YuYu-Tei card search"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "python-dotenv>=1,<2", "psycopg[binary]>=3.2,<4", "SQLAlchemy>=2.0.36,<2.1", "alembic>=1.14,<2", "cryptography>=46,<47"]

[project.scripts]
tcg-search = "tcg_toolkit.cli:main"
tcg-db = "tcg_toolkit.db_cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3", "XlsxWriter>=3.2,<4", "openpyxl>=3.1,<4", "defusedxml>=0.7,<1", "Pillow>=12,<13"]

[tool.setuptools.package-data]
tcg_toolkit = ["static/*", "migrations/*.sql", "migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
