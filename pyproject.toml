[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcg-toolkit"
version = "0.1.0"
description = "Normalized YuYu-Tei card search"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "python-dotenv>=1,<2"]

[project.scripts]
tcg-search = "tcg_toolkit.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "argon2-cffi>=23.1,<26", "email-validator>=2.2,<3"]

[tool.setuptools.package-data]
tcg_toolkit = ["static/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
