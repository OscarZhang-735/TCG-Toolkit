name: tcg-http
services:
  web:
    image: ${TCG_IMAGE:?Set immutable image digest}
    ports:
      - "127.0.0.1:18080:8000"
    environment:
      TCG_SMTP_HOST: "${TCG_SMTP_HOST:-}"
      TCG_SMTP_PORT: "${TCG_SMTP_PORT:-}"
      TCG_SMTP_USERNAME: "${TCG_SMTP_USERNAME:-}"
      TCG_SMTP_PASSWORD: "${TCG_SMTP_PASSWORD:-}"
      TCG_SMTP_FROM: "${TCG_SMTP_FROM:-}"
      TCG_SMTP_TLS: "${TCG_SMTP_TLS:-starttls}"
      TCG_EMAIL_CODE_SECRET: "${TCG_EMAIL_CODE_SECRET:-}"
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      TCG_SEARCH_PROXY_URL: "${TCG_SEARCH_PROXY_URL-http://62.234.212.90:8080/proxy}"
      TCG_TRUSTED_ORIGINS: https://tcgtoolkit.rinne.love,https://oscarzhang-735.github.io
      TCG_USER_DB: /app/data/users.sqlite3
      TCG_CURRENCY_CACHE: /app/data/currency.sqlite3
      API_DOMAIN: ${API_DOMAIN:?Set backend domain}
      FORWARDED_ALLOW_IPS: ${TCG_PROXY_IPS:?Set Docker bridge gateway}
    volumes:
      - data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  data:
    name: tcg-http-data
